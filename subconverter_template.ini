ruleset=🇨🇳_国内直连,IP-CIDR,169.254.0.0/16

# 中国 IP 直连（通过 GEOIP）
ruleset=🇨🇳_国内直连,GEOIP,CN

# ---------- 下载专用 ----------
# 按进程名匹配（需要在 Clash 端开启 process 规则支持）
ruleset=📥_下载专用,PROCESS-NAME,qbittorrent
ruleset=📥_下载专用,PROCESS-NAME,transmission
ruleset=📥_下载专用,PROCESS-NAME,aria2c
ruleset=📥_下载专用,PROCESS-NAME,webtorrent
