# ============================================
# Subconverter 自定义模板 - 精简稳定版
# 适用于 Clash / Clash.Meta
# ============================================

[common]
api_mode=true
managed_prefix=http://127.0.0.1:25500

# ==================== 节点输出过滤 ====================
# 只保留评分高的节点（可按需调整）
include_remarks=★
include_remarks=[★★★★
# 排除包含以下关键词的节点（广告/推广）
exclude_remarks=(吃瓜|关注|进群|免费|邀请|订阅)
exclude_protocol=ssr

# ==================== Emoji 替换规则 ====================
emoji=true
add_emoji=true
remove_emoji=false

[proxy_groups]
# 自定义策略组 - subconverter 语法

# 1. 主力节点（手动选择）
custom_proxy_group=🚀_主力节点`select`♻️_自动测速`🎯_手动选择`DIRECT

# 2. 自动测速组
custom_proxy_group=♻️_自动测速`url-test`http://www.gstatic.com/generate_204`300`50

# 3. 手动选择组
custom_proxy_group=🎯_手动选择`select`.*`DIRECT

# 4. AI 服务组
custom_proxy_group=🤖_AI_服务`select`♻️_自动测速`🎯_手动选择`DIRECT

# 5. 流媒体组（负载均衡）
custom_proxy_group=📺_流媒体`load-balance`http://www.gstatic.com/generate_204`300`consistent-hashing

# 6. 国内直连组
custom_proxy_group=🇨🇳_国内直连`select`DIRECT`♻️_自动测速

# 7. 下载专用组
custom_proxy_group=📥_下载专用`select`DIRECT`♻️_自动测速

# ==================== 规则集定义 ====================
# 使用 Loyalsoldier 的规则集
[rule]
# AI 服务
ruleset=🤖_AI_服务,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/openai.txt
ruleset=🤖_AI_服务,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/gemini.txt

# 流媒体
ruleset=📺_流媒体,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/youtube.txt
ruleset=📺_流媒体,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/netflix.txt

# 国内直连
ruleset=🇨🇳_国内直连,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt
ruleset=🇨🇳_国内直连,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/private.txt

# 代理走主力
ruleset=🚀_主力节点,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/gfw.txt
ruleset=🚀_主力节点,https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/greatfire.txt

# 下载专用（按进程名匹配，由 Clash 端处理）
ruleset=📥_下载专用,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Download.list

# 局域网直连
ruleset=🇨🇳_国内直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list

# 默认规则 - 剩余流量走主力
ruleset=🚀_主力节点,[]MATCH
